
name: Docker Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - fix/nginx-security-update
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: identity-hub-frontend:test

      - name: Verify nginx version
        run: |
          docker run --rm --entrypoint nginx \
            identity-hub-frontend:test -v 2>&1 | tee nginx-version.txt
          grep -Fx "nginx version: nginx/1.30.7" nginx-version.txt

      - name: Start container
        run: |
          docker run -d \
            --name identity-hub-test \
            -p 8080:8080 \
            identity-hub-frontend:test

      - name: Test frontend
        run: |
          curl --fail --retry 10 --retry-delay 3 \
            --retry-connrefused http://localhost:8080/

      - name: Container logs
        if: always()
        run: docker logs identity-hub-test || true

      - name: Clean up
        if: always()
        run: docker rm -f identity-hub-test || true

